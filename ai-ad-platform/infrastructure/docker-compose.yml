version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-ad-postgres
    environment:
      POSTGRES_USER: adgenius
      POSTGRES_PASSWORD: adgenius_secret
      POSTGRES_DB: ai_ad_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adgenius"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-ad-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai-ad-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://adgenius:adgenius_secret@postgres:5432/ai_ad_platform
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      APP_ENV: production
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - asset_storage:/tmp/ai-ad-assets

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai-ad-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai-ad-celery
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://adgenius:adgenius_secret@postgres:5432/ai_ad_platform
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
  redis_data:
  asset_storage:
